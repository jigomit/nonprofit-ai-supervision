; Two processes this application does not work without, and neither announces
; itself when missing. Without the worker, every run sits at "queued" for ever
; and the interface looks merely slow. Without the scheduler, the calendar
; never speaks — which is the feature that earns a return visit.
;
;   sudo cp deploy/supervisor.conf /etc/supervisor/conf.d/signoff.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Replace /var/www/signoff and the user to match the host.

[program:signoff-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/signoff/artisan queue:work --sleep=3 --tries=2 --max-time=3600
directory=/var/www/signoff
autostart=true
autorestart=true
user=www-data
; One worker is enough to start. A model call holds the process for minutes,
; so raise this before a pilot organization runs several tasks at once.
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/signoff/storage/logs/worker.log
stopwaitsecs=3600

[program:signoff-scheduler]
command=php /var/www/signoff/artisan schedule:work
directory=/var/www/signoff
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/signoff/storage/logs/scheduler.log
